<div id="error-message" class="notification is-danger is-light animate__animated animate__shakeX">
    <button class="delete" onclick="this.parentElement.remove()"></button>
    <div class="is-flex is-align-items-center">
        <span class="icon is-large mr-3">
            <i class="fas fa-exclamation-triangle fa-2x"></i>
        </span>
        <div>
            <strong>Ooops! Something went sideways</strong><br>
            {{ message|default:"We couldn't find what you're looking for. Mind trying with different words?" }}
        </div>
    </div>
</div>

<script>
    // Error message will disappear automatically after 15 seconds
    setTimeout(() => {
        const err = document.getElementById('error-message');
        if(err) err.classList.add('animate__fadeOut');
        setTimeout(() => err?.remove(), 1000);
    }, 15000);
</script>
