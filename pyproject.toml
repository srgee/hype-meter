[project]
name = "hype-meter"
version = "0.9"
description = "The hype meter app"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "django~=6.0.1",
    "django-environ>=0.12.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.1,<10",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
DJANGO_SETTINGS_MODULE = "config.settings"
